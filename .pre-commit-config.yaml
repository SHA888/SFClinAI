# Pre-commit hooks for SFClinAI
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end-of-file whitespace
      - id: check-yaml
        name: Check YAML syntax
        args: [--unsafe]
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # Markdown linting (manual only - skip in automatic pre-commit)
  # Many documents have long lines (diagrams, references) that are acceptable
  # Run manually: pre-commit run --hook-stage manual markdownlint

  # Local Rust checks (using system cargo)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo fmt
        entry: bash -c "cd clinlat && cargo fmt --all --"
        language: system
        pass_filenames: false
        types: [rust]
        stages: [commit]
        files: ^clinlat/
      - id: cargo-clippy
        name: Cargo clippy
        entry: bash -c "cd clinlat && cargo clippy --all-targets --all-features -- -D warnings"
        language: system
        pass_filenames: false
        types: [rust]
        stages: [commit]
        files: ^clinlat/
      - id: cargo-check
        name: Cargo check
        entry: bash -c "cd clinlat && cargo check --all-features"
        language: system
        pass_filenames: false
        types: [rust]
        stages: [commit]
        files: ^clinlat/
      - id: cargo-doc
        name: Cargo doc
        entry: bash -c "cd clinlat && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features --document-private-items"
        language: system
        pass_filenames: false
        types: [rust]
        stages: [commit]
        files: ^clinlat/

# Configuration per file type
exclude: |
  (?x)^(
    \.git/|
    \.claude/|
    \.harness-mem/|
    target/|
    clinlat/target/|
    \.github/|
    LICENSE|
    LICENSE-MIT|
    LICENSE-APACHE
  )
