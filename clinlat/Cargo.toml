[package]
name = "clinlat"
version = "0.2.0"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SHA888/SFClinAI"
documentation = "https://docs.rs/clinlat"
description = "A symbolic substrate for clinical decision-making based on refinable hypothesis lattices and sound deduction operators"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"

[dev-dependencies]
proptest = "1"
